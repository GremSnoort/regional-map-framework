# Replace maps.example.com before enabling this file. Initially this HTTP
# virtual host is suitable only for ACME validation; do not enter credentials
# until certbot (or an equivalent ACME client) has enabled HTTPS and redirect.
server {
    listen 80;
    listen [::]:80;
    server_name maps.example.com;

    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Deliberately overwrite, rather than append, the client-supplied value.
        # This is required when RMF_TRUST_PROXY=1.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    }
}
