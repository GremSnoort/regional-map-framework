name: deploy-production
run-name: Deploy ${{ github.sha }} to production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.actor == 'GremSnoort' &&
      github.repository == 'GremSnoort/regional-map-framework' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r pipeline_core/requirements-lock.txt
      - run: python -m unittest discover -s tests
      - run: node --check core/gallery.js
      - run: python manage.py self-test
      - run: python manage.py verify-core
      - run: python manage.py validate-all --allow-missing-data
      - run: node --check core/map.js

  deploy:
    needs: validate
    if: >-
      github.actor == 'GremSnoort' &&
      github.repository == 'GremSnoort/regional-map-framework' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure restricted SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
      - name: Deploy the exact validated commit
        env:
          DEPLOY_HOST: ${{ vars.VPS_HOST }}
          DEPLOY_USER: ${{ vars.VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -eu
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          case "$DEPLOY_SHA" in
            *[!0-9a-f]*|'') exit 2 ;;
          esac
          test "${#DEPLOY_SHA}" -eq 40
          ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $DEPLOY_SHA"
