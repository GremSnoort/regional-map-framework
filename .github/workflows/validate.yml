name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r pipeline_core/requirements-lock.txt
      - run: python -m unittest discover -s tests
      - run: python manage.py self-test
      - run: python manage.py verify-core
      - run: python manage.py validate-all --allow-missing-data
      - run: node --check core/map.js
