name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: python manage.py self-test
      - run: python manage.py verify-core
      - run: python manage.py validate-all --allow-missing-data
      - run: node --check core/map.js
